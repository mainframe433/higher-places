name: Keep the database awake
# Supabase pauses free projects after a week with no activity. This pings it once a day.
on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase
        env:
          SB_URL: https://yltvzutjxlsqmxpmpggv.supabase.co
          SB_KEY: sb_publishable_McvHKJzSaNuP-ibiLfdQVg_4vRjSTKb
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $SB_KEY" "$SB_URL/rest/v1/circles?select=id&limit=1")
          echo "Database answered with $code"
          case "$code" in 2*|401|403) exit 0;; *) echo "The database may be paused. Open supabase.com and restore it."; exit 1;; esac
