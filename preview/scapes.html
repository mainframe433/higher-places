<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Higher Places design preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Overpass:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#F5F5F7;--ink-2:#A2A6B3;--ink-3:#70747F;--line:rgba(255,255,255,.12);--accent:#B184E6;--mono:"DM Mono",ui-monospace,monospace;--sans:"Overpass",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0B0C0F;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh}

/* presentation: on a computer, two phones at an angle like the reference; on a phone, one screen per page height */
.stage{display:flex;justify-content:center;align-items:center;gap:64px;padding:70px 40px 40px;background:radial-gradient(120% 90% at 50% 20%,#2A2E35 0,#121418 70%)}
.phone{position:relative;flex:none;width:414px;height:869px;padding:12px;border-radius:66px;background:#1C1E22;box-shadow:inset 0 0 0 2px #5C6068,inset 0 0 0 6px #0A0A0C,0 60px 90px -30px rgba(0,0,0,.85)}
.phone:nth-child(1){transform:rotate(-4deg) translateY(16px)}
.phone:nth-child(2){transform:rotate(4deg)}
.island{position:absolute;z-index:40;left:50%;top:23px;width:120px;height:35px;margin-left:-60px;border-radius:20px;background:#000}
.screen{position:relative;width:390px;height:845px;overflow:hidden;border-radius:54px;background:#000;isolation:isolate}
.credits{max-width:900px;margin:0 auto;padding:22px 24px 40px;font:400 11px/1.6 var(--sans);color:#6A6E78}
.credits a{color:inherit}
.credits b{font-weight:600;color:#8A8E98}
@media (max-width:860px){
  .stage{display:block;padding:0;background:#000}
  .phone{width:auto;height:auto;padding:0;border-radius:0;background:none;box-shadow:none;transform:none!important;display:flex;justify-content:center;align-items:flex-start;height:calc(845px*var(--k));overflow:hidden;margin-bottom:28px}
  .island{display:none}
  .screen{border-radius:0;transform:scale(var(--k));transform-origin:top center;flex:none}
}

/* shared bits */
.sb{position:absolute;z-index:30;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:8px 32px 0 40px;font:600 16px/1 var(--sans)}
.sb i{display:flex;gap:6px;align-items:center}
.wm{display:flex;align-items:center;gap:9px;font:500 12.5px/1 var(--mono);letter-spacing:.16em}
.pill{position:absolute;z-index:25;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:rgba(22,23,28,.78);border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 40px -10px rgba(0,0,0,.9);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.pill span{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;color:#C2C5CF}
.pill .on{background:#fff;color:#0B0B0E}
.pill .cam{background:var(--accent);color:#1A0E26}
.pill .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,#C9A6F2,#5A2E86);border:1.5px solid rgba(255,255,255,.6)}
.home{position:absolute;z-index:40;left:50%;bottom:8px;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#fff}
.ph{display:block;width:100%;height:100%;object-fit:cover;background:#1A1B20}

/* ---------- map ---------- */
#map .top{position:absolute;z-index:6;top:62px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:16px}
#map .search{display:flex;align-items:center;gap:10px;font:400 14px/1 var(--mono);color:var(--ink-3)}
#map .globe{position:absolute;z-index:1;left:5px;top:118px;width:380px;height:380px}
#map .globe img{width:100%;height:100%;display:block}
.tile{position:absolute;z-index:3;border-radius:22px;overflow:hidden;border:3px solid #fff;box-shadow:0 20px 34px -12px rgba(0,0,0,.8)}
.you{position:absolute;z-index:4;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--accent);border:2.5px solid #fff;box-shadow:0 0 0 7px rgba(177,132,230,.28),0 0 24px 8px rgba(177,132,230,.45)}
.you em{position:absolute;left:22px;top:-6px;white-space:nowrap;font:600 11px/1 var(--sans);font-style:normal;padding:5px 8px 4px;border-radius:999px;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#map .sect{position:absolute;z-index:6;left:0;right:0;top:516px}
.sect h2{display:flex;align-items:baseline;justify-content:space-between;padding:0 24px 14px;font:400 21px/1 var(--mono);letter-spacing:-.01em}
.sect h2 small{font:500 13px/1 var(--sans);color:var(--ink-2);letter-spacing:0}
.rail{display:flex;gap:14px;padding:0 24px;overflow:hidden}
.card{flex:none;width:156px}
.card .im{position:relative;width:156px;height:156px;border-radius:24px;overflow:hidden}
.card .d{position:absolute;top:9px;left:9px;padding:5px 9px 4px;border-radius:999px;background:rgba(0,0,0,.5);font:500 11px/1 var(--mono);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.card b{display:block;margin-top:10px;font:600 15px/1.15 var(--sans);letter-spacing:-.01em}
.card span{display:block;margin-top:3px;font:500 12.5px/1.2 var(--sans);color:var(--ink-3)}
#map .peek{position:absolute;z-index:6;left:24px;top:778px;font:400 21px/1 var(--mono);color:rgba(255,255,255,.9)}

/* ---------- community ---------- */
#comm .hero{position:absolute;inset:0;z-index:0}
#comm .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.55) 0,rgba(0,0,0,.08) 30%,rgba(0,0,0,0) 46%,rgba(0,0,0,.5) 64%,#000 82%)}
#comm .top{position:absolute;z-index:5;top:64px;left:24px;right:24px}
#comm .eyebrow{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:7px 12px 6px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);font:600 12px/1 var(--sans);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#comm .eyebrow svg{color:#E8C66B}
#comm h1{margin-top:14px;font:400 37px/1.08 var(--mono);letter-spacing:-.025em;text-shadow:0 2px 24px rgba(0,0,0,.45)}
#comm .lede{margin-top:12px;max-width:300px;font:500 16px/1.4 var(--sans);color:rgba(255,255,255,.9);text-shadow:0 1px 14px rgba(0,0,0,.5)}
#comm .cta{position:absolute;z-index:5;left:24px;right:24px;top:500px;height:56px;border-radius:999px;background:#fff;color:#0B0B0E;display:flex;align-items:center;justify-content:center;gap:10px;font:500 16px/1 var(--mono);letter-spacing:-.01em;box-shadow:0 18px 30px -14px rgba(0,0,0,.7)}
#comm .sect{position:absolute;z-index:5;left:0;right:0;top:596px}
.fresh{display:flex;gap:10px;padding:0 24px}
.fresh .f{position:relative;flex:none;width:104px;height:132px;border-radius:20px;overflow:hidden;border:2px solid rgba(255,255,255,.9)}
.fresh .f .by{position:absolute;left:6px;right:6px;bottom:6px;display:flex;align-items:center;gap:5px;padding:4px 7px 3px 4px;border-radius:999px;background:rgba(0,0,0,.55);font:600 10.5px/1 var(--sans);white-space:nowrap;overflow:hidden;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.fresh .f .by i{flex:none;width:15px;height:15px;border-radius:50%}
.fresh .f .new{position:absolute;top:7px;left:7px;padding:4px 7px 3px;border-radius:999px;background:var(--accent);color:#1A0E26;font:600 10px/1 var(--mono)}
</style></head>

": "Flip Flops Hawaii", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File:View_from_top_of_Hole-in-the-Rock_in_Arizona.jpg"}, "townlake": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/2013%2C_View_S%2C_Tempe_Town_Lake%2C_ASU_Stadium%2C_Tempe_Butte-A_Mountain_-_panoramio.jpg/1280px-2013%2C_View_S%2C_Tempe_Town_Lake%2C_ASU_Stadium%2C_Tempe_Butte-A_Mountain_-_panoramio.jpg", "by": "Chris English", "lic": "CC BY-SA 3.0", "page": "https://commons.wikimedia.org/wiki/File:2013,_View_S,_Tempe_Town_Lake,_ASU_Stadium,_Tempe_Butte-A_Mountain_-_panoramio.jpg"}, "golden": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Waterfall_stream_atop_Mogollon_Rim_%283910802312%29.jpg/1280px-Waterfall_stream_atop_Mogollon_Rim_%283910802312%29.jpg", "by": "Coconino National Forest", "lic": "CC BY-SA 2.0", "page": "https://commons.wikimedia.org/wiki/File:Waterfall_stream_atop_Mogollon_Rim_(3910802312).jpg"}, "sliderock": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/69/23-04-01_SlideRockStateParkSedona-3887.jpg/1280px-23-04-01_SlideRockStateParkSedona-3887.jpg", "by": "mbaylor", "lic": "CC BY 2.0", "page": "https://commons.wikimedia.org/wiki/File:23-04-01_SlideRockStateParkSedona-3887.jpg"}, "devilsbridge": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Devil%27s_Bridge_Trail%2C_Sedona%2C_Arizona_-_panoramio_%2838%29.jpg/1280px-Devil%27s_Bridge_Trail%2C_Sedona%2C_Arizona_-_panoramio_%2838%29.jpg", "by": "davidpinter", "lic": "CC BY 3.0", "page": "https://commons.wikimedia.org/wiki/File:Devil%27s_Bridge_Trail,_Sedona,_Arizona_-_panoramio_(38).jpg"}, "lockett": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c0/Lockett_Meadow_%2834447135960%29.jpg/1280px-Lockett_Meadow_%2834447135960%29.jpg", "by": "Coconino National Forest", "lic": "CC0", "page": "https://commons.wikimedia.org/wiki/File:Lockett_Meadow_(34447135960).jpg"}, "powell": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/11/Lake_Powell_from_Wahweap_Overlook%2C_Page%2C_Arizona_-_April_2026.jpg/1280px-Lake_Powell_from_Wahweap_Overlook%2C_Page%2C_Arizona_-_April_2026.jpg", "by": "Christian David", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File:Lake_Powell_from_Wahweap_Overlook,_Page,_Arizona_-_April_2026.jpg"}, "airportmesa": {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/Sedona_Sunset_Airport_Mesa.jpg/1280px-Sedona_Sunset_Airport_Mesa.jpg", "by": "Greg Sumers", "lic": "CC BY-SA 4.0", "page": "https://commons.wikimedia.org/wiki/File:Sedona_Sunset_Airport_Mesa.jpg"}};
const G={"mather": [170.8, 173.4], "horseshoe": [172.2, 171.4], "cathedral": [171.2, 176.7], "camel": [170.5, 180.0], "sabino": [172.8, 183.3], "golden": [172.9, 178.1], "havasu": [165.7, 177.1]};
const $=s=>document.querySelector(s);
/* fit one screen per phone width when viewed on a phone */
const fit=()=>document.documentElement.style.setProperty('--k',Math.min(innerWidth/390,1.15));fit();addEventListener('resize',fit);

/* map: photos resting on the globe around Arizona, like the reference */
const T=[['mather',108,'left:24px;top:150px',-6],['horseshoe',78,'left:250px;top:136px',5],['cathedral',90,'left:262px;top:262px',-4],['camel',96,'left:54px;top:322px',4],['sabino',74,'left:186px;top:378px',-6]];
$('#tiles').innerHTML=T.map(([k,s,pos,r])=>`<div class="tile" style="${pos};width:${s}px;height:${s}px;transform:rotate(${r}deg)"><img class="ph" src="${PH[k].url}" alt=""></div>`).join('')
  +`<span class="you" style="left:${5+G.camel[0]}px;top:${118+G.camel[1]}px"><em>You</em></span>`;
$('#near').innerHTML=[['hole','Hole-in-the-Rock','Papago Park','0.1 mi'],['townlake','Tempe Town Lake','Tempe Beach Park','1.4 mi'],['camel','Camelback Mountain','Echo Canyon','4.6 mi']]
  .map(([k,n,a,d])=>`<div class="card"><div class="im"><img class="ph" src="${PH[k].url}" alt=""><span class="d">${d}</span></div><b>${n}</b><span>${a}</span></div>`).join('');

/* community */
$('#heroimg').src=PH.golden.url;
const who=[['sliderock','kai.az','#C9A6F2'],['devilsbridge','mesa.mo','#7FB3FF'],['lockett','flagstaff.j','#F2B880'],['powell','desertrat','#9BE3C3']];
$('#fresh').innerHTML=who.map(([k,u,c],i)=>`<div class="f"><img class="ph" src="${PH[k].url}" alt="">${i<2?'<span class="new">New</span>':''}<span class="by"><i style="background:${c}"></i>${u}</span></div>`).join('');

/* photo credits (Wikimedia Commons, CC licenses) */
const used=[...new Set([...T.map(t=>t[0]),'hole','townlake','camel','golden',...who.map(w=>w[0])])];
$('#credits').innerHTML='<b>Design preview, not part of the app.</b> Earth imagery: NASA Blue Marble. Photos from Wikimedia Commons: '+used.map(k=>`<a href="${PH[k].page}">${PH[k].by}</a> (${PH[k].lic})`).join(', ')+'.';
</script>
</body></html>
